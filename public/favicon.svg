<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A29"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#FF5A00" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#FF5A00" stroke-width="12" stroke-opacity="0.35"/>
  
  <!-- Monogram JS in Bold Modern Typography -->
  <text x="256" y="345" 
        font-family="Outfit, system-ui, -apple-system, sans-serif" 
        font-size="250" 
        font-weight="900" 
        letter-spacing="-16" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        filter="url(#glow)">JS</text>
</svg>
